name: Weekly retrain

# Every Monday: rebuild the image without cache. The build downloads the latest
# two years of Open-Meteo history and retrains the model (with the quality gate),
# then the image is scanned, pushed to GHCR, and Render is told to redeploy,
# which retrains the live model the same way.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  retrain-and-rebuild:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name and date tag
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "week=weekly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.week }}
            ${{ steps.image.outputs.name }}:latest

      - name: Show new model metrics
        run: docker run --rm --entrypoint cat "${{ steps.image.outputs.name }}:latest" /app/model_metrics.json

      - name: Scan image for vulnerabilities (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0 image
          --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress
          "${{ steps.image.outputs.name }}:latest"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.week }}"
          docker push "${{ steps.image.outputs.name }}:latest"

  deploy:
    needs: retrain-and-rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (retrains the live model)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
